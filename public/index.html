<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F07A1E">
<title>Quiz da Segurança CIPA Momesso</title>
<link rel="icon" href="/img/logo-cipa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFF8F2; --surface:#FFFFFF; --ink:#2B1E14; --muted:#7A6455;
  --line:#F1E2D4; --line-strong:#E4CDBA;
  --accent:#F07A1E; --accent-ink:#BF560A; --accent-soft:#FFEEDF;
  --btn:#D9640F; --on-accent:#FFFFFF;
  --ok:#23873A; --ok-soft:#E6F4E9; --on-ok:#FFFFFF;
  --bad:#C2372C; --bad-soft:#FCEBE8;
  --stripe-gap:#FFFFFF;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17110C; --surface:#221912; --ink:#F7EDE4; --muted:#B9A595;
    --line:#382A20; --line-strong:#4C3A2D;
    --accent:#FF8A33; --accent-ink:#FFA05A; --accent-soft:#3A2414;
    --btn:#FF8A33; --on-accent:#1B110A;
    --ok:#55C46D; --ok-soft:#14301C; --on-ok:#0D1A10;
    --bad:#FF7468; --bad-soft:#3A1916;
    --stripe-gap:#17110C;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button,select{font:inherit}
.wrap{width:100%;max-width:600px;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--stripe-gap) 12px 24px)}
.brand{background:var(--surface);border-bottom:1px solid var(--line)}
.brand .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand .lm{height:30px;width:auto;max-width:55%}
.brand .lc{height:56px;width:auto}
main{flex:1;padding-block:28px 40px}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:16px calc(20px + env(safe-area-inset-bottom, 0px));font-size:13.5px;color:var(--muted)}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.area-cipa{display:inline-flex;align-items:center;min-height:32px;color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.area-cipa:hover{color:var(--accent-ink)}
.area-cipa:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.eyebrow{font:600 13px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin:0}
h1:focus{outline:none}
.q-h1{font:800 clamp(42px,12vw,58px)/.9 var(--font-display);text-transform:uppercase;margin:8px 0 14px;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:60ch}
.regras{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.regras li{font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.aviso{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:var(--bad-soft);font-size:15.5px}
.entrada{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px 20px}
.entrada-t{font:700 24px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.q-label{display:block;font-weight:600;margin:18px 0 8px}
.q-campo{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink)}
.q-campo::placeholder{color:var(--muted)}
select.q-campo{appearance:none;-webkit-appearance:none;padding-right:44px;background-image:linear-gradient(45deg,transparent 50%,var(--accent-ink) 50%),linear-gradient(135deg,var(--accent-ink) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat}
.q-campo:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.q-campo[aria-invalid="true"]{border-color:var(--bad)}
.q-err{color:var(--bad);font-size:15px;margin:8px 0 0}
.q-aj{color:var(--muted);font-size:14px;margin:8px 0 0}
.carregando{display:flex;align-items:center;gap:12px;color:var(--muted);padding:40px 0}
.giro{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--accent);animation:giro 1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}

.q-topo{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.como{font-size:14px;color:var(--muted);margin:0}
.como strong{color:var(--ink);font-weight:600}
.sair{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.sair:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.linha-cont{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:18px 0 0}
.contagem{font:700 18px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;margin:0;font-variant-numeric:tabular-nums}
.cronometro{display:inline-flex;align-items:center;gap:6px;font:700 18px/1 var(--font-display);letter-spacing:.04em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.barra{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:6px;margin:10px 0 26px}
.barra i{height:6px;border-radius:3px;background:var(--line)}
.barra i.feita{background:var(--accent)}
.barra i.atual{background:var(--accent);opacity:.4}
.q-head{display:flex;gap:16px;align-items:flex-start}
.q-icone{flex:none;width:64px;height:76px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.q-icone b{font:700 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.q-texto{font:700 clamp(26px,6.8vw,32px)/1.08 var(--font-display);margin:0;text-wrap:balance;min-width:0;flex:1}
fieldset.opcoes{border:0;margin:24px 0 0;padding:0;display:grid;gap:10px;min-width:0}
fieldset.opcoes legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.opt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .15s,background-color .15s}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 18px/1 var(--font-display);border:2px solid var(--line-strong);color:var(--muted)}
.opt .t{flex:1;min-width:0;font-weight:500;line-height:1.35}
.opt:hover{border-color:var(--accent)}
.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.acoes{margin-top:22px;display:grid;gap:10px}
.btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:12px 20px;border-radius:12px;font:700 21px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;background:var(--btn);color:var(--on-accent);text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.sec{background:transparent;color:var(--accent-ink);border:2px solid var(--accent)}

.vitoria{background:var(--btn);color:var(--on-accent);border-radius:18px;overflow:hidden}
.vitoria .faixa{height:12px;background:repeating-linear-gradient(-45deg,var(--on-accent) 0 12px,transparent 12px 24px);opacity:.85}
.vitoria-corpo{padding:26px 22px 24px;display:grid;gap:16px;justify-items:start}
.bombom{width:68px;height:68px;border-radius:50%;background:var(--on-accent);color:var(--btn);display:grid;place-items:center}
.vitoria h1{font:800 clamp(36px,10vw,50px)/.92 var(--font-display);text-transform:uppercase;margin:0;text-wrap:balance}
.vitoria .retire{font:700 clamp(21px,5.6vw,26px)/1.12 var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin:0;padding-top:16px;border-top:2px dashed currentColor;width:100%}
.cartao{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.cartao h2{font:700 14px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.comprovante dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.comprovante dt{color:var(--muted);font-size:15px}
.comprovante dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.codigo{font:700 26px/1 var(--font-display);letter-spacing:.18em;color:var(--accent-ink)}
.nota{font-size:14px;color:var(--muted);margin:14px 0 0}
.derrota{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px}
.derrota h1{font:800 clamp(32px,8.5vw,42px)/.98 var(--font-display);text-transform:uppercase;margin:0 0 10px;text-wrap:balance}
.derrota .lead{color:var(--ink)}
.placar{display:flex;gap:6px;margin:0 0 14px}
.placar i{width:28px;height:8px;border-radius:4px;background:var(--bad)}
.placar i.on{background:var(--ok)}
.revisao{list-style:none;margin:0;padding:0;display:grid}
.revisao li{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.revisao li:first-child{border-top:0;padding-top:0}
.ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.ic.ok{background:var(--ok);color:var(--on-ok)}
.ic.erro{background:var(--bad);color:var(--on-ok)}
.revisao p{margin:0;font-weight:600;line-height:1.35}
.revisao small{display:block;color:var(--muted);font-size:14.5px;font-weight:400;margin-top:3px}
.revisao small b{font-weight:600;color:var(--ink)}
.revisao .certo-t{color:var(--ok)}
.revisao .errado-t{color:var(--bad)}
.rank-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:4px}
.rank-head h2{margin:0}
.rank-sub{font-size:14px;color:var(--muted);margin:0 0 10px}
.ranking{list-style:none;margin:0;padding:0}
.ranking li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-top:1px solid var(--line);border-radius:10px}
.ranking li:first-child{border-top-color:transparent}
.ranking li.eu{background:var(--accent-soft);border-top-color:transparent}
.ranking li.eu + li{border-top-color:transparent}
.ranking li.sep{display:block;text-align:center;color:var(--muted);padding:4px;border-top:0}
.pos{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font:700 17px/1 var(--font-display);background:var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.pos.top{background:var(--btn);color:var(--on-accent)}
.rk-nome{min-width:0;line-height:1.25}
.rk-nome strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-nome span{font-size:13.5px;color:var(--muted)}
.rk-tempo{font:700 19px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.vazio{padding:16px 0 4px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<header class="brand">
  <div class="wrap">
    <img class="lm" src="/img/logo-momesso.png" alt="Momesso">
    <img class="lc" src="/img/logo-cipa.png" alt="CIPA Segurança">
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer><div class="wrap rodape"><span><strong>CIPA Momesso</strong> · Comissão Interna de Prevenção de Acidentes e de Assédio</span><a class="area-cipa" href="/painel">Área da CIPA</a></div></footer>

<script>
const SVG = (inner, size, sw) => `<svg width="${size || 30}" height="${size || 30}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICONES = {
  velocidade: SVG('<path d="M3.5 16a8.5 8.5 0 1 1 17 0"/><path d="M12 16l4.2-5"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/><path d="M6.2 10.2l1 .8M12 7.2v1.2M17.8 10.2l-1 .8"/>'),
  carro: SVG('<path d="M4 15.5V12l2.1-4.6A1.6 1.6 0 0 1 7.6 6.4h8.8a1.6 1.6 0 0 1 1.5 1L20 12v3.5"/><path d="M3 12.5h18v4H3z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>'),
  pedestre: SVG('<ellipse cx="8" cy="7.5" rx="2.6" ry="4.2"/><path d="M6.2 15.2h3.6l-.3 2.6a1.5 1.5 0 0 1-3 0z"/><ellipse cx="16" cy="10.5" rx="2.6" ry="4.2"/><path d="M14.2 18.2h3.6l-.3 1.9a1.5 1.5 0 0 1-3 0z"/>'),
  moto: SVG('<circle cx="5.5" cy="16" r="3.2"/><circle cx="18.5" cy="16" r="3.2"/><path d="M5.5 16l3.6-6h5.4l4 6"/><path d="M14.5 10l-1.6-3.5H10.5M15.5 6.5h2.8"/>'),
  padrao: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>')
};
const CERTO = (s) => SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>', s || 20, 2.6);
const ERRADO = (s) => SVG('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>', s || 20, 2.6);
const RELOGIO = SVG('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/>', 18, 2.2);

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const dataHora = (i) => new Intl.DateTimeFormat("pt-BR", { timeZone:"America/Sao_Paulo", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }).format(new Date(i)).replace(",", " às");
// 4200 -> "4,2 s" · 65000 -> "1 min 05 s"
function tempo(ms) {
  const s = Math.max(0, ms) / 1000;
  if (s < 60) return s.toFixed(1).replace(".", ",") + " s";
  const m = Math.floor(s / 60);
  return `${m} min ${String(Math.floor(s % 60)).padStart(2, "0")} s`;
}
const relogio = (ms) => { const s = Math.floor(Math.max(0, ms) / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

const Q = {
  tela:"carregando", erroTela:"", aviso:"",
  setores:[], perguntas:[],
  nome:"", setorId:"", erros:{},
  sessao:null, idx:0, escolha:null, resultado:null, ranking:[],
  inicioLocal:0, enviando:false, erroPergunta:"", precisaRecomecar:false, atualizandoRanking:false
};
let timer = null;

async function api(acao, corpo) {
  let r;
  try {
    r = await fetch(`/api/quiz?acao=${acao}`, corpo
      ? { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(corpo) }
      : { cache:"no-store" });
  } catch {
    throw Object.assign(new Error("Sem conexão com o servidor. Confira a internet e tente de novo."), { codigo:"rede" });
  }
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(j.erro || "Não foi possível continuar. Tente de novo."), { codigo:j.codigo, status:r.status });
  return j;
}

/* ---------- Telas ---------- */
function render(focarTitulo) {
  const app = $("#app");
  if (Q.tela === "carregando") app.innerHTML = `<div class="carregando"><span class="giro" aria-hidden="true"></span>Carregando o quiz…</div>`;
  else if (Q.tela === "falha") app.innerHTML = `<p class="eyebrow">CIPA Momesso</p><h1 class="q-h1" tabindex="-1">Quiz da Segurança</h1>
      <p class="aviso">${esc(Q.erroTela)}</p><div class="acoes"><button type="button" class="btn" data-act="recarregar">Tentar de novo</button></div>`;
  else if (Q.tela === "entrada") app.innerHTML = telaEntrada();
  else if (Q.tela === "pergunta") app.innerHTML = telaPergunta();
  else if (Q.tela === "resultado") app.innerHTML = telaResultado();
  if (focarTitulo) { const h = app.querySelector("h1"); if (h) h.focus({ preventScroll:true }); window.scrollTo(0, 0); }
}

function telaEntrada() {
  const n = Q.perguntas.length, e = Q.erros;
  const semSetor = !Q.setores.length;
  return `<p class="eyebrow">CIPA Momesso</p>
  <h1 class="q-h1" tabindex="-1">Quiz da Segurança</h1>
  <p class="lead">${n} perguntas sobre as regras de circulação no estacionamento da empresa. Você vê o resultado e as respostas certas no final.</p>
  <ul class="regras"><li>${n} perguntas</li><li>1 tentativa por pessoa</li><li>Acertou todas, ganha brinde</li><li>Os mais rápidos lideram o ranking</li></ul>
  ${Q.aviso ? `<p class="aviso" role="alert">${esc(Q.aviso)}</p>` : ""}
  <form id="form-entrada" class="entrada" novalidate>
    <h2 class="entrada-t">Identifique-se</h2>
    <label class="q-label" for="nome">Seu nome e sobrenome</label>
    <input id="nome" class="q-campo" maxlength="120" autocomplete="name" autocapitalize="words" spellcheck="false" value="${esc(Q.nome)}" aria-describedby="nome-err" ${e.nome ? 'aria-invalid="true"' : ""}>
    <p id="nome-err" class="q-err" ${e.nome ? "" : "hidden"}>${esc(e.nome || "")}</p>
    <label class="q-label" for="setor">Seu setor</label>
    <select id="setor" class="q-campo" aria-describedby="setor-err" ${e.setor ? 'aria-invalid="true"' : ""} ${semSetor ? "disabled" : ""}>
      <option value="">${semSetor ? "Nenhum setor cadastrado ainda" : "Escolha seu setor"}</option>
      ${Q.setores.map((s) => `<option value="${esc(s.id)}" ${s.id === Q.setorId ? "selected" : ""}>${esc(s.nome)}</option>`).join("")}
    </select>
    <p id="setor-err" class="q-err" ${e.setor ? "" : "hidden"}>${esc(e.setor || "")}</p>
    <p class="q-aj">O tempo começa a contar quando você tocar em Começar.</p>
    <div class="acoes"><button type="submit" class="btn" ${Q.enviando || semSetor ? "disabled" : ""}>${Q.enviando ? "Entrando…" : "Começar o quiz"}</button></div>
    ${semSetor ? `<p class="q-aj">Fale com um membro da CIPA.</p>` : ""}
  </form>`;
}
function telaPergunta() {
  const p = Q.perguntas[Q.idx], n = Q.perguntas.length, ultima = Q.idx === n - 1;
  const opts = Object.keys(p.opcoes).sort().map((l) =>
    `<label class="opt ${l === Q.escolha ? "sel" : ""}" for="op-${l}" data-letra="${l}"><input type="radio" name="resp" id="op-${l}" value="${l}" ${Q.escolha === l ? "checked" : ""} ${Q.enviando ? "disabled" : ""}><span class="l">${l}</span><span class="t">${esc(p.opcoes[l])}</span></label>`).join("");
  const botao = Q.precisaRecomecar
    ? `<button type="button" class="btn" data-act="voltar">Voltar ao início</button>`
    : `<button type="button" id="conf" class="btn" data-act="confirmar" ${Q.escolha && !Q.enviando ? "" : "disabled"}>${Q.enviando ? "Enviando…" : ultima ? "Finalizar quiz" : "Confirmar e avançar"}</button>`;
  return `<div class="q-topo"><p class="como">Respondendo como <strong>${esc(Q.sessao.nome)}</strong> · ${esc(Q.sessao.setor)}</p>
    <button type="button" class="sair" data-act="voltar">Sair e continuar depois</button></div>
  <div class="linha-cont"><p class="contagem">Pergunta ${Q.idx + 1} de ${n}</p><span class="cronometro" aria-label="Tempo">${RELOGIO}<span id="cron">${relogio(Date.now() - Q.inicioLocal)}</span></span></div>
  <div class="barra" style="--n:${n}" aria-hidden="true">${Q.perguntas.map((_, i) => `<i class="${i < Q.idx ? "feita" : i === Q.idx ? "atual" : ""}"></i>`).join("")}</div>
  <div class="q-head"><div class="q-icone" aria-hidden="true">${ICONES[p.icone] || ICONES.padrao}<b>${String(Q.idx + 1).padStart(2, "0")}</b></div>
    <h1 class="q-texto" tabindex="-1">${esc(p.texto)}</h1></div>
  <fieldset class="opcoes"><legend>${esc(p.texto)}</legend>${opts}</fieldset>
  ${Q.erroPergunta ? `<p class="aviso" role="alert">${esc(Q.erroPergunta)}</p>` : ""}
  <div class="acoes">${botao}</div>`;
}
function telaResultado() {
  const t = Q.resultado, perfeito = t.acertos === t.total;
  const pos = posicoes(Q.ranking);
  const minha = pos.find((r) => r.id === t.id);
  const topo = perfeito
    ? `<div class="vitoria"><div class="faixa" aria-hidden="true"></div><div class="vitoria-corpo">
      <div class="bombom" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4.6"/><path d="M7.6 12L2.5 8.2v7.6zM16.4 12l5.1-3.8v7.6z"/></svg></div>
      <h1 tabindex="-1">Parabéns, você acertou todas as perguntas!</h1>
      <p class="retire">Retire seu brinde com o setor responsável</p></div></div>
    <div class="cartao comprovante"><h2>Comprovante de participação</h2><dl>
      <dt>Nome</dt><dd>${esc(t.nome)}</dd><dt>Setor</dt><dd>${esc(t.setor)}</dd>
      <dt>Resultado</dt><dd>${t.acertos} de ${t.total} perguntas</dd>
      <dt>Tempo</dt><dd>${esc(tempo(t.ms))}${minha ? ` · ${minha.pos}º lugar no ranking` : ""}</dd>
      <dt>Concluído em</dt><dd>${esc(dataHora(t.concluidaEm))}</dd>
      <dt>Código</dt><dd class="codigo">${esc(t.codigo)}</dd></dl>
      <p class="nota">Mostre esta tela no momento da retirada. Se preferir, tire um print.</p></div>`
    : `<div class="derrota"><div class="placar" aria-hidden="true">${(t.revisao || []).map((x) => `<i class="${x.acertou ? "on" : ""}"></i>`).join("")}</div>
      <h1 tabindex="-1">Você acertou ${t.acertos} de ${t.total} perguntas</h1>
      <p class="lead">Para ganhar o brinde e entrar no ranking era preciso acertar todas. Sua participação foi registrada. Confira abaixo as respostas certas e leve essas regras para o dia a dia.</p></div>`;
  const rev = (t.revisao || []).map((x, i) => `<li><span class="ic ${x.acertou ? "ok" : "erro"}">${x.acertou ? CERTO(15) : ERRADO(15)}</span><div style="min-width:0"><p>${i + 1}. ${esc(x.texto)}</p>${x.acertou
    ? `<small class="certo-t">Sua resposta: <b>${esc(x.marcada)}) ${esc(x.textoMarcada)}</b></small>`
    : `<small class="errado-t">Sua resposta: <b>${x.marcada ? `${esc(x.marcada)}) ${esc(x.textoMarcada)}` : "não respondida"}</b></small><small class="certo-t">Resposta certa: <b>${esc(x.certa)}) ${esc(x.textoCerto)}</b></small>`}</div></li>`).join("");
  return topo +
    `<section class="cartao"><h2>Suas respostas · ${t.acertos} certa${t.acertos === 1 ? "" : "s"} e ${t.total - t.acertos} errada${t.total - t.acertos === 1 ? "" : "s"}</h2><ul class="revisao">${rev}</ul></section>
    <section class="cartao" id="ranking">${rankingHtml(pos, t.id)}</section>
    <div class="acoes"><button type="button" class="btn sec" data-act="inicio">Voltar ao início</button></div>`;
}

/* ---------- Ranking ---------- */
// Mesmo tempo (ao milésimo) divide a posição
function posicoes(lista) {
  const out = [];
  lista.forEach((r, i) => { const ant = out[i - 1]; out.push({ ...r, pos: ant && ant.ms === r.ms ? ant.pos : i + 1 }); });
  return out;
}
const MOSTRAR = 10;
function rankingHtml(pos, meuId) {
  const linha = (r) => `<li class="${r.id === meuId ? "eu" : ""}"><span class="pos ${r.pos <= 3 ? "top" : ""}">${r.pos}</span>
    <span class="rk-nome"><strong>${esc(r.nome)}${r.id === meuId ? " (você)" : ""}</strong><span>${esc(r.setor)}</span></span><span class="rk-tempo">${esc(tempo(r.ms))}</span></li>`;
  let itens;
  if (!pos.length) itens = `<li class="vazio">Ninguém acertou todas ainda.</li>`;
  else {
    const i = pos.findIndex((r) => r.id === meuId);
    itens = pos.slice(0, MOSTRAR).map(linha).join("");
    if (i >= MOSTRAR) itens += (i > MOSTRAR ? `<li class="sep" aria-hidden="true">⋯</li>` : "") + linha(pos[i]);
  }
  const resto = pos.length > MOSTRAR ? ` · mostrando os ${MOSTRAR} primeiros` : "";
  return `<div class="rank-head"><h2>Ranking · quem acertou todas</h2><button type="button" class="sair" data-act="atualizar-ranking" ${Q.atualizandoRanking ? "disabled" : ""}>${Q.atualizandoRanking ? "Atualizando…" : "Atualizar"}</button></div>
    <p class="rank-sub">Do mais rápido ao mais lento. ${pos.length} pessoa${pos.length === 1 ? "" : "s"} no ranking${resto}.</p>
    <ol class="ranking">${itens}</ol>`;
}

/* ---------- Fluxo ---------- */
function pararCronometro() { clearInterval(timer); timer = null; }
function ligarCronometro() {
  pararCronometro();
  timer = setInterval(() => { const c = $("#cron"); if (c) c.textContent = relogio(Date.now() - Q.inicioLocal); else pararCronometro(); }, 500);
}
async function carregar(manterAviso) {
  pararCronometro();
  if (!manterAviso) Q.aviso = "";
  Q.tela = "carregando"; render();
  try {
    const d = await api("inicio");
    Q.setores = d.setores; Q.perguntas = d.perguntas;
    if (Q.setorId && !Q.setores.some((s) => s.id === Q.setorId)) Q.setorId = "";
    Q.tela = "entrada";
  } catch (e) { Q.tela = "falha"; Q.erroTela = e.message; }
  render(true);
}
async function iniciar() {
  Q.enviando = true; Q.aviso = ""; render();
  try {
    const d = await api("iniciar", { nome: Q.nome, setorId: Q.setorId });
    Q.sessao = { tentativaId: d.tentativaId, token: d.token, nome: d.nome, setor: d.setor };
    // Cronômetro local alinhado ao relógio do servidor (vale também ao retomar)
    Q.inicioLocal = Date.now() - (Date.parse(d.agora) - Date.parse(d.iniciadaEm));
    const feitas = new Set(d.respondidas);
    Q.idx = Math.max(0, Q.perguntas.findIndex((p) => !feitas.has(p.id)));
    Q.escolha = null; Q.erroPergunta = ""; Q.precisaRecomecar = false;
    Q.enviando = false; Q.tela = "pergunta"; render(true); ligarCronometro();
  } catch (e) {
    Q.enviando = false;
    if (e.codigo === "setor_invalido") { Q.setorId = ""; Q.aviso = e.message; await carregar(true); return; }
    if (e.status === 400 && /nome/i.test(e.message)) Q.erros = { nome: e.message };
    else Q.aviso = e.message;
    render(); const n = Q.erros.nome ? $("#nome") : null; if (n) n.focus();
  }
}
async function confirmar() {
  if (!Q.escolha || Q.enviando) return;
  const p = Q.perguntas[Q.idx];
  Q.enviando = true; Q.erroPergunta = ""; render();
  try {
    const r = await api("responder", { tentativaId: Q.sessao.tentativaId, token: Q.sessao.token, perguntaId: p.id, letra: Q.escolha });
    Q.enviando = false;
    if (r.concluida) {
      pararCronometro();
      Q.resultado = r.resultado; Q.ranking = r.ranking || [];
      Q.tela = "resultado"; render(true); return;
    }
    Q.idx++; Q.escolha = null; render(true);
  } catch (e) {
    Q.enviando = false; Q.erroPergunta = e.message;
    Q.precisaRecomecar = ["sessao_invalida", "fora_de_ordem", "ja_respondeu"].includes(e.codigo);
    if (Q.precisaRecomecar) pararCronometro();
    render();
  }
}
async function atualizarRanking() {
  if (Q.atualizandoRanking) return;
  Q.atualizandoRanking = true; $("#ranking").innerHTML = rankingHtml(posicoes(Q.ranking), Q.resultado.id);
  try { Q.ranking = (await api("ranking")).ranking; } catch {}
  Q.atualizandoRanking = false; $("#ranking").innerHTML = rankingHtml(posicoes(Q.ranking), Q.resultado.id);
}

/* ---------- Eventos ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "recarregar") carregar();
  else if (a === "voltar") { Q.sessao = null; carregar(); }
  else if (a === "inicio") { Q.sessao = null; Q.resultado = null; Q.nome = ""; Q.setorId = ""; Q.erros = {}; carregar(); }
  else if (a === "confirmar") confirmar();
  else if (a === "atualizar-ranking") atualizarRanking();
});
document.addEventListener("change", (e) => {
  if (e.target.name === "resp" && !Q.enviando) {
    Q.escolha = e.target.value;
    document.querySelectorAll("#app .opt").forEach((n) => n.classList.toggle("sel", n.dataset.letra === Q.escolha));
    const c = $("#conf"); if (c) c.disabled = false;
  }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id !== "form-entrada" || Q.enviando) return;
  Q.nome = $("#nome").value.trim().replace(/\s+/g, " ");
  Q.setorId = $("#setor").value;
  const er = {};
  if (Q.nome.split(" ").filter((p) => p.length >= 2).length < 2) er.nome = "Digite seu nome e sobrenome.";
  if (!Q.setorId) er.setor = "Escolha seu setor.";
  Q.erros = er;
  if (Object.keys(er).length) { render(); $(er.nome ? "#nome" : "#setor").focus(); return; }
  iniciar();
});

carregar();
</script>
</body>
</html>
