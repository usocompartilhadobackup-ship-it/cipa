<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel da CIPA Momesso</title>
<link rel="icon" href="/img/logo-cipa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFF8F2; --surface:#FFFFFF; --surface-2:#FBF2E9; --ink:#2B1E14; --muted:#7A6455;
  --line:#F1E2D4; --line-strong:#E4CDBA;
  --accent:#F07A1E; --accent-ink:#BF560A; --accent-soft:#FFEEDF;
  --btn:#D9640F; --on-accent:#FFFFFF;
  --ok:#23873A; --ok-soft:#E6F4E9; --on-ok:#FFFFFF;
  --bad:#C2372C; --bad-soft:#FCEBE8;
  --stripe-gap:#FFFFFF; --knob:#FFFFFF;
  --shadow:0 18px 50px -24px rgba(90,45,10,.45);
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17110C; --surface:#221912; --surface-2:#1C150F; --ink:#F7EDE4; --muted:#B9A595;
    --line:#382A20; --line-strong:#4C3A2D;
    --accent:#FF8A33; --accent-ink:#FFA05A; --accent-soft:#3A2414;
    --btn:#FF8A33; --on-accent:#1B110A;
    --ok:#55C46D; --ok-soft:#14301C; --on-ok:#0D1A10;
    --bad:#FF7468; --bad-soft:#3A1916;
    --stripe-gap:#17110C; --knob:#FFFFFF;
    --shadow:0 18px 50px -24px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.ocupado{cursor:progress}
button{font:inherit}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font:600 12.5px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin:0}
h1:focus{outline:none}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--stripe-gap) 12px 24px)}

.bo-head{background:var(--surface);border-bottom:1px solid var(--line)}
.bo-head .in{max-width:1280px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:10px;flex-wrap:wrap}
.bo-brand{display:flex;align-items:center;gap:14px}
.bo-brand .lm{height:24px;width:auto}
.bo-brand .lc{height:44px;width:auto}
.bo-brand .sep{width:1px;height:30px;background:var(--line-strong)}
.bo-dir{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bo-user{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.25}
.bo-user div span{display:block;color:var(--muted);font-size:13px}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font:700 15px/1 var(--font-display)}
.bo{max-width:1280px;margin-inline:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
.bo-nav{padding-block:22px;position:sticky;top:0;align-self:start;display:flex;flex-direction:column;gap:2px}
.nav-grupo{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 12px 6px}
.nav-grupo:first-child{margin-top:0}
.nav-item{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:500}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav-item:focus-visible{outline:3px solid var(--accent);outline-offset:-2px}
.badge{font-size:12px;font-weight:700;background:var(--btn);color:var(--on-accent);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.bo-main{padding-block:22px 64px;min-width:0}
@media (max-width:880px){
  .bo{grid-template-columns:minmax(0,1fr);gap:0}
  .bo-nav{position:static;flex-direction:row;overflow-x:auto;padding-block:12px 4px;gap:6px}
  .nav-grupo{display:none}
  .nav-item{width:auto;white-space:nowrap;border:1px solid var(--line)}
}
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:20px}
.pg-head h1{font:800 clamp(32px,4vw,42px)/1 var(--font-display);text-transform:uppercase;margin:6px 0 0}
.pg-sub{color:var(--muted);margin:6px 0 0;font-size:15px;max-width:62ch}
.pg-acoes{display:flex;gap:10px;flex-wrap:wrap}
.atual{font-size:13.5px;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.carregando{display:flex;align-items:center;gap:12px;color:var(--muted);padding:40px 0}
.giro{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--accent);animation:giro 1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.falha{background:var(--bad-soft);border-radius:14px;padding:18px;max-width:640px}
.falha p{margin:0 0 14px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .v{font:700 38px/1 var(--font-display);font-variant-numeric:tabular-nums}
.tile .v small{font-size:20px;color:var(--muted);font-weight:600}
.tile .r{font-size:13.5px;color:var(--muted);margin-top:6px}
.tile .k{font-size:14px;font-weight:600;margin-bottom:8px}
.tile.destaque{background:var(--btn);color:var(--on-accent);border-color:transparent}
.tile.destaque .r,.tile.destaque .v small{color:inherit;opacity:.88}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.bloco h2{font:700 22px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.bloco-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.bloco-sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.pilha{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1040px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mini-rank{list-style:none;margin:0;padding:0}
.mini-rank li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.mini-rank li:first-child{border-top:0;padding-top:0}
.mini-rank .nm{min-width:0;line-height:1.25}
.mini-rank .nm strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-rank .nm span{font-size:13px;color:var(--muted)}
.mini-rank .tp{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:700 16px/1 var(--font-display);background:var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.pos.top{background:var(--btn);color:var(--on-accent)}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.4}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent-ink)}
.pill.neutro{background:var(--line);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pontos{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.pontos i{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.pontos i.on{background:var(--ok)}
.ac{font-weight:700;font-variant-numeric:tabular-nums}
.perg{display:grid;gap:7px;padding-block:12px;border-top:1px solid var(--line)}
.perg:first-child{border-top:0;padding-top:0}
.perg-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:600}
.perg-t .pc{font:700 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.trilho{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.trilho i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.trilho.laranja i{background:var(--accent)}
.dist{font-size:13.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.dist b{color:var(--ok)}
.barra-ferr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.campo{font:inherit;font-size:15px;padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
.campo::placeholder{color:var(--muted)}
.campo:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.campo[aria-invalid="true"]{border-color:var(--bad)}
.campo.busca{flex:1 1 220px}
textarea.campo{width:100%;min-height:150px;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:14px;line-height:1.5;resize:vertical}
.check{display:inline-flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.check input{accent-color:var(--btn);width:18px;height:18px;margin:0}
.btn-s{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font:700 16px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;background:var(--btn);color:var(--on-accent);white-space:nowrap}
.btn-s:hover{filter:brightness(1.07)}
.btn-s.sec{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent)}
.btn-s.peq{padding:7px 12px;font-size:14px}
.btn-s.perigo{background:var(--bad);color:var(--on-ok)}
.btn-s:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn-s[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.lk{all:unset;cursor:pointer;color:var(--accent-ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.lk.perigo{color:var(--bad)}
.lk:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.lk-acoes{display:flex;gap:14px;align-items:center}
.mut{color:var(--muted)}
.tabela{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.nome-c{white-space:normal;min-width:170px;font-weight:600}
tr.clicavel{cursor:pointer}
tr.clicavel:hover td,tr.clicavel[aria-expanded="true"] td{background:var(--surface-2)}
tr.clicavel:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
tr.det td{background:var(--surface-2);white-space:normal;padding:4px 12px 14px}
.det-lista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.det-lista li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.35}
.det-lista small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.ic.ok{background:var(--ok);color:var(--on-ok)}
.ic.erro{background:var(--bad);color:var(--on-ok)}
.nota-regra{display:flex;gap:10px;align-items:center;margin:14px 0 0;font-size:14px;color:var(--muted)}
.vazio-b{padding:22px 12px;text-align:center;color:var(--muted)}
.form-painel{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:18px;margin-bottom:16px}
.form-painel h2{font:700 22px/1.1 var(--font-display);text-transform:uppercase;margin:0 0 14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fld{display:grid;gap:6px;align-content:start}
.fld label,.fld .rot{font-weight:600;font-size:14px}
.err{color:var(--bad);font-size:13.5px;margin:0}
.aj{color:var(--muted);font-size:13px;margin:0}
.form-acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.aviso-b{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.aviso-b.erro{background:var(--bad-soft)}
.cards{display:grid;gap:10px}
.cartao{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cartao .info{min-width:0;flex:1 1 220px}
.cartao .info strong{display:block;font-size:17px;font-weight:600}
.cartao .info span{font-size:14px;color:var(--muted)}
.cartao .lado-c{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.cartao.entregue{background:var(--surface-2)}
.codigo{font:700 24px/1 var(--font-display);letter-spacing:.18em;color:var(--accent-ink)}
.confirma{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.sub-h{font:700 17px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 10px}
.sub-h:first-child{margin-top:0}
.switch{display:flex;gap:16px;align-items:flex-start;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:14px;background:var(--line-strong);position:relative;cursor:pointer;margin:2px 0 0;transition:background-color .15s}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--knob);transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.switch input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.switch strong{display:block;font-size:17px}
.switch span{display:block;color:var(--muted);font-size:14.5px;max-width:60ch;margin-top:2px}
.link-box{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.url{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:14.5px;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);user-select:all;overflow-wrap:anywhere;min-width:0}
.qr-area{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin-top:18px}
.qr{background:#FFFFFF;padding:12px;border-radius:12px;line-height:0;border:1px solid var(--line)}
.qr canvas{width:168px;height:168px;display:block;image-rendering:pixelated}
.acessos{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.acessos li{padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.acessos code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:13.5px;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.login{max-width:420px;margin:40px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
.login h1{font:800 34px/1 var(--font-display);text-transform:uppercase;margin:6px 0 6px}
.login .fld{margin-top:16px}
.login .campo{width:100%;font-size:16px;padding:11px 12px}
.login .btn-s{width:100%;padding:14px 16px;font-size:18px;margin-top:20px}
.bo.sem-nav{grid-template-columns:minmax(0,1fr)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;font-weight:500;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<header class="bo-head">
  <div class="in gut">
    <div class="bo-brand"><img class="lm" src="/img/logo-momesso.png" alt="Momesso"><span class="sep" aria-hidden="true"></span><img class="lc" src="/img/logo-cipa.png" alt="CIPA Segurança"></div>
    <div class="bo-dir">
      <a class="lk" href="/" target="_blank" rel="noopener">Abrir o quiz</a>
      <button type="button" class="lk" data-act="sair" id="bt-sair" hidden>Sair</button>
    </div>
  </div>
</header>
<div class="bo gut">
  <nav id="bo-nav" class="bo-nav" aria-label="Seções"></nav>
  <main id="bo-main" class="bo-main"><div class="carregando"><span class="giro" aria-hidden="true"></span>Carregando o painel…</div></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ================= Estado ================= */
let S = { setores:[], funcionarios:[], tentativas:{}, papel:null, atualizadoEm:null };
let PERGUNTAS = [];
const SECOES_VALIDAS = ["visao","ranking","brindes","setores","config"];
const ADMIN_SECOES = ["setores","config"];
const UI = { secao: SECOES_VALIDAS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "visao", carregado:false };
const F = {
  rk:{ busca:"", setor:"", todas:false, aberto:null },
  br:{ busca:"", confirmando:null },
  st:{ renomeando:null, excluindo:null, erro:"", erroRen:"", novo:"" }
};
let ocupado = false;

/* ================= Utilidades ================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const norm = (s) => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const iniciais = (nome) => { const p = nome.trim().split(/\s+/); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };
const fmtDH = new Intl.DateTimeFormat("pt-BR", { timeZone:"America/Sao_Paulo", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
const fmtH = new Intl.DateTimeFormat("pt-BR", { timeZone:"America/Sao_Paulo", hour:"2-digit", minute:"2-digit" });
const dataHora = (i) => fmtDH.format(new Date(i)).replace(",", " às");
const hora = (i) => fmtH.format(new Date(i));
// 4.2 -> "4,2 s" · 65 -> "1 min 05 s" (mesmo formato do quiz)
const mmss = (s) => s < 60 ? s.toFixed(1).replace(".", ",") + " s" : `${Math.floor(s / 60)} min ${String(Math.floor(s % 60)).padStart(2, "0")} s`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const hojeISO = () => new Date().toLocaleDateString("sv-SE", { timeZone:"America/Sao_Paulo" });

const SVG = (inner, size, sw) => `<svg width="${size || 28}" height="${size || 28}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const CERTO = (s) => SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>', s || 18, 2.6);
const ERRADO = (s) => SVG('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>', s || 18, 2.6);
const CADEADO = SVG('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 18, 2);

let toastTimer = null;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800); }
function focar(sel) { const n = typeof sel === "string" ? $(sel) : sel; if (n) n.focus({ preventScroll:true }); }
function baixar(blob, nome) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ================= API ================= */
async function api(metodo, acao, corpo) {
  let r;
  try {
    r = await fetch(`/api/admin?acao=${acao}`, {
      method: metodo, cache: "no-store", credentials: "same-origin",
      headers: corpo ? { "content-type": "application/json" } : {},
      body: corpo ? JSON.stringify(corpo) : undefined
    });
  } catch { throw new Error("Sem conexão com o servidor. Confira a internet e tente de novo."); }
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401 && j.login) throw Object.assign(new Error(j.erro), { login: true });
  if (!r.ok) throw new Error(j.erro || "Não foi possível concluir. Tente de novo.");
  return j;
}
function aplicar(d) {
  S = { setores:d.setores, funcionarios:d.funcionarios, tentativas:{}, papel:d.papel, atualizadoEm:new Date() };
  d.tentativas.forEach((t) => { S.tentativas[t.funcionarioId] = t; });
  PERGUNTAS = d.perguntas;
}
async function recarregar() { aplicar(await api("GET", "estado")); }
async function executar(acao, corpo, aoErro) {
  if (ocupado) return null;
  ocupado = true; document.body.classList.add("ocupado");
  try {
    const r = await api("POST", acao, corpo);
    try { await recarregar(); } catch (e) { toast(e.message); }
    if (r.mensagem) toast(r.mensagem);
    return r;
  } catch (e) {
    if (e.login) { mostrarLogin("Sua sessão expirou. Entre de novo."); return null; }
    if (aoErro) aoErro(e.message); else toast(e.message);
    return null;
  } finally { ocupado = false; document.body.classList.remove("ocupado"); }
}

/* ================= Regras calculadas ================= */
const tempoSeg = (t) => (Date.parse(t.concluidaEm) - Date.parse(t.iniciadaEm)) / 1000;
function ranking() {
  const lista = Object.values(S.tentativas).filter((t) => t.status === "concluida").map((t) => ({ fid:t.funcionarioId, t, tempo:tempoSeg(t) }));
  lista.sort((a, b) => b.t.acertos - a.t.acertos || a.tempo - b.tempo || Date.parse(a.t.concluidaEm) - Date.parse(b.t.concluidaEm));
  lista.forEach((r, i) => { const ant = lista[i - 1]; r.pos = (i && ant.t.acertos === r.t.acertos && ant.tempo === r.tempo) ? ant.pos : i + 1; });
  return lista;
}
function indicadores() {
  const ts = Object.values(S.tentativas);
  const concl = ts.filter((t) => t.status === "concluida");
  const prem = concl.filter((t) => t.acertos === t.total);
  return { participantes:ts.length, concluidas:concl.length, premiados:prem.length, entregues:prem.filter((t) => t.brindeEm).length, andamento:ts.length - concl.length };
}
function pontos(n, total) { return `<span class="pontos" aria-hidden="true">${Array.from({ length:total }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`; }

    const dist = Object.keys(p.opcoes).sort().map((l) => { const n = marcadas.filter((r) => r.l === l).length; return l === p.correta ? `<b>${l}: ${n} (certa)</b>` : `<span>${l}: ${n}</span>`; }).join("");

function exportarCSV() {

  const csv = "\ufeff" + linhas.map((l) => l.map((c) => { const s = String(c == null ? "" : c); return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\r\n");

function qrCanvas(escala, margem) {
  if (typeof qrcode !== "function") return null;
  const q = qrcode(0, "M"); q.addData(linkQuiz()); q.make();
  const n = q.getModuleCount(), lado = (n + margem * 2) * escala;
  const c = document.createElement("canvas"); c.width = c.height = lado;
  const g = c.getContext("2d"); g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, lado, lado); g.fillStyle = "#000000";
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) g.fillRect((col + margem) * escala, (r + margem) * escala, escala, escala);
  return c;
}
function renderQR() {
  const box = $("#qr"); if (!box) return;
  const c = qrCanvas(6, 0);
  if (c) box.replaceChildren(c); else box.innerHTML = `<div style="width:168px;height:168px;display:grid;place-items:center;color:#555;font-size:13px;line-height:1.3;text-align:center">Não foi possível<br>gerar o QR Code</div>`;
}

/* ================= Eventos ================= */
const ACOES = {
  nav: (b) => { UI.secao = b.dataset.s; F.rk.aberto = null; F.br.confirmando = null; history.replaceState(null, "", "#" + UI.secao); renderTudo(true); window.scrollTo(0, 0); atualizarSilencioso(); },
  "rk-abrir": (b) => { F.rk.aberto = F.rk.aberto === b.dataset.f ? null : b.dataset.f; renderRankingTabela(); focar(`tr[data-f="${b.dataset.f}"]`); },
  csv: () => exportarCSV(),
  "br-registrar": (b) => { F.br.confirmando = b.dataset.t; renderBrindesLista(); focar('[data-act="br-ok"]'); },
  "br-cancelar": () => { F.br.confirmando = null; renderBrindesLista(); },
  "br-ok": async (b) => { const r = await executar("brinde", { tentativaId: b.dataset.t }); F.br.confirmando = null; renderNav(); renderBrindesLista(); if (!r) return; },
  "st-renomear": (b) => { F.st.renomeando = b.dataset.s; F.st.excluindo = null; F.st.erroRen = ""; renderSecao(); focar("#st-ren"); },
  "st-cancelar": () => { F.st.renomeando = F.st.excluindo = null; F.st.erroRen = ""; renderSecao(); },
  "st-ativo": async (b) => { const s = S.setores.find((x) => x.id === b.dataset.s); await executar("setor-ativo", { id:s.id, ativo:!s.ativo }); renderTudo(); },
  "st-excluir": (b) => { F.st.excluindo = b.dataset.s; F.st.renomeando = null; renderSecao(); focar('[data-act="st-excluir-ok"]'); },
  "st-excluir-ok": async (b) => { await executar("setor-excluir", { id:b.dataset.s }); F.st.excluindo = null; renderTudo(); },
  copiar: () => {
    const sel = () => { const r = document.createRange(); r.selectNodeContents($("#cfg-url")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(linkQuiz()).then(() => toast("Link copiado."), () => { sel(); toast("Link selecionado. Use Ctrl+C para copiar."); }); }
    catch { sel(); toast("Link selecionado. Use Ctrl+C para copiar."); }
  },
  "qr-baixar": () => {
    const c = qrCanvas(24, 4);
    if (!c) { toast("Não foi possível gerar o QR Code. Recarregue a página e tente de novo."); return; }
    c.toBlob((blob) => baixar(blob, "qrcode-quiz-cipa.png"), "image/png");
  },
  recarregar: () => iniciar(),
  sair: async () => { try { await api("POST", "sair"); } catch {} mostrarLogin(""); }
};
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  if (ocupado && !["nav","rk-abrir","csv","copiar","qr-baixar"].includes(b.dataset.act)) return;
  const fn = ACOES[b.dataset.act]; if (fn) fn(b, e);
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-act]")) { e.preventDefault(); ACOES[e.target.dataset.act](e.target); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "rk-busca") { F.rk.busca = t.value; F.rk.aberto = null; renderRankingTabela(); }
  else if (t.id === "br-busca") { F.br.busca = t.value; F.br.confirmando = null; renderBrindesLista(); }
  else if (t.id === "st-nome") F.st.novo = t.value;
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "rk-setor") { F.rk.setor = t.value; F.rk.aberto = null; renderRankingTabela(); }
  else if (t.id === "rk-todas") { F.rk.todas = t.checked; F.rk.aberto = null; renderRankingTabela(); }
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (ocupado) return;
  const id = e.target.id;
  if (id === "form-login") entrar();
  else if (id === "form-st") {
    const nome = $("#st-nome").value.trim().replace(/\s+/g, " "); F.st.novo = nome;
    if (nome.length < 2) { F.st.erro = "Informe o nome do setor."; renderSecao(); focar("#st-nome"); return; }
    if (S.setores.some((s) => norm(s.nome) === norm(nome))) { F.st.erro = "Já existe um setor com esse nome."; renderSecao(); focar("#st-nome"); return; }
    const r = await executar("setor-salvar", { nome }, (msg) => { F.st.erro = msg; });
    if (r) { F.st.erro = ""; F.st.novo = ""; }
    renderTudo(); focar("#st-nome");
  }
  else if (id === "form-ren") {
    const sid = e.target.dataset.s; const nome = $("#st-ren").value.trim().replace(/\s+/g, " ");
    if (nome.length < 2) { F.st.erroRen = "Informe o nome do setor."; renderSecao(); focar("#st-ren"); return; }
    if (S.setores.some((s) => s.id !== sid && norm(s.nome) === norm(nome))) { F.st.erroRen = "Já existe um setor com esse nome."; renderSecao(); focar("#st-ren"); return; }
    const r = await executar("setor-salvar", { id:sid, nome }, (msg) => { F.st.erroRen = msg; });
    if (r) { F.st.renomeando = null; F.st.erroRen = ""; }
    renderTudo();
  }
});

/* ================= Atualização automática (painel) ================= */
// Busca os dados de novo sem atrapalhar quem está digitando ou confirmando algo
async function atualizarSilencioso() {
  if (!UI.carregado || ocupado || UI.login) return;
  const secao = UI.secao;
  try { await recarregar(); } catch (e) { if (e.login) mostrarLogin("Sua sessão expirou. Entre de novo."); return; /* senão, tenta de novo no próximo ciclo */ }
  if (UI.secao !== secao || ocupado) return;
  renderNav();
  const ativo = document.activeElement;
  const digitando = ativo && ativo.matches("input, select, textarea");
  if (secao === "visao") renderSecao();
  else if (secao === "ranking") renderRankingTabela();
  else if (secao === "brindes" && !F.br.confirmando) renderBrindesLista();
  else if (secao === "setores" && !digitando && !F.st.renomeando && !F.st.excluindo) renderSecao();
  const a = $("#atualizado"); if (a) a.textContent = `Atualizado às ${hora(S.atualizadoEm)}`;
}
setInterval(() => {
  if (document.visibilityState !== "visible" || F.br.confirmando) return;
  if (!["visao","ranking","brindes"].includes(UI.secao)) return;
  const ativo = document.activeElement;
  if (ativo && ativo.matches("input, select, textarea")) return;
  atualizarSilencioso();
}, 20000);

/* ================= Login ================= */
function mostrarLogin(aviso, erro) {
  UI.login = true; UI.carregado = false;
  $("#bo-nav").innerHTML = ""; $("#bo-nav").hidden = true; $(".bo").classList.add("sem-nav"); $("#bt-sair").hidden = true;
  $("#bo-main").innerHTML = `<form class="login" id="form-login" novalidate>
    <p class="eyebrow">Painel da CIPA</p><h1 tabindex="-1">Entrar</h1>
    <p class="pg-sub" style="margin:0">Acesso restrito aos membros da CIPA.</p>
    ${aviso ? `<p class="aviso-b">${esc(aviso)}</p>` : ""}
    <div class="fld"><label for="lg-email">E-mail</label><input id="lg-email" class="campo" type="email" autocomplete="username" required></div>
    <div class="fld"><label for="lg-senha">Senha</label><input id="lg-senha" class="campo" type="password" autocomplete="current-password" required></div>
    ${erro ? `<p class="aviso-b erro" role="alert">${esc(erro)}</p>` : ""}
    <button type="submit" class="btn-s">Entrar</button>
  </form>`;
  focar("#lg-email");
}
async function entrar() {
  const email = $("#lg-email").value.trim(), senha = $("#lg-senha").value;
  if (!email || !senha) { mostrarLogin("", "Preencha o e-mail e a senha."); $("#lg-email").value = email; return; }
  const bt = $("#form-login button"); bt.disabled = true; bt.textContent = "Entrando…";
  try {
    await api("POST", "login", { email, senha });
    iniciar();
  } catch (e) {
    mostrarLogin("", e.message); $("#lg-email").value = email; focar("#lg-senha");
  }
}

async function iniciar() {
  UI.login = false;
  $("#bo-nav").hidden = false; $(".bo").classList.remove("sem-nav");
  $("#bo-main").innerHTML = `<div class="carregando"><span class="giro" aria-hidden="true"></span>Carregando o painel…</div>`;
  try {
    await recarregar();
    UI.carregado = true;
    $("#bt-sair").hidden = false;
    renderTudo();
  } catch (e) {
    if (e.login) { mostrarLogin(""); return; }
    $("#bo-main").innerHTML = `<div class="falha" role="alert"><p>${esc(e.message)}</p><button type="button" class="btn-s" data-act="recarregar">Tentar de novo</button></div>`;
  }
}
iniciar();
</script>
